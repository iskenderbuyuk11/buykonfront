<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/favicon.js"></script>
    <title>Admin Giriş | Buykon</title>
    <meta name="bizdevar-api" content="https://api.buykon.com/api" />
    <script src="../js/site-config.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="admin-login.css?v=3" />
</head>
<body class="admin-login-body">
    <div class="admin-login-wrap"><div class="admin-login-card">
        <div class="admin-login-brand"><div class="admin-login-brand__icon"><i class="fa-solid fa-shield-halved"></i></div><h1>Buykon Admin</h1></div>
        <p class="admin-error" id="adminError" hidden></p>
        <form class="admin-step-panel" id="emailPanel">
            <div class="admin-field"><i class="fa-solid fa-envelope admin-field__icon"></i><input type="email" id="email" autocomplete="email" placeholder="Email" required /></div>
            <button type="submit" class="admin-btn admin-btn--primary" id="btnEmail">Davam et <i class="fa-solid fa-arrow-right"></i></button>
        </form>
        <form class="admin-step-panel" id="loginPanel" hidden>
            <div class="admin-field"><i class="fa-solid fa-lock admin-field__icon"></i><input type="password" id="password" autocomplete="current-password" placeholder="Şifrə" required /></div>
            <button type="submit" class="admin-btn admin-btn--primary" id="btnLogin">Daxil ol <i class="fa-solid fa-right-to-bracket"></i></button>
            <button type="button" class="admin-btn admin-btn--ghost btnBack"><i class="fa-solid fa-arrow-left"></i></button>
        </form>
        <form class="admin-step-panel" id="setupPanel" hidden>
            <div class="admin-field"><i class="fa-solid fa-key admin-field__icon"></i><input type="password" id="newPassword" autocomplete="new-password" minlength="8" placeholder="Yeni şifrə" required /></div>
            <div class="admin-field"><i class="fa-solid fa-key admin-field__icon"></i><input type="password" id="newPassword2" autocomplete="new-password" minlength="8" placeholder="Şifrəni təkrarlayın" required /></div>
            <button type="submit" class="admin-btn admin-btn--primary" id="btnSetup">Şifrəni təyin et və daxil ol</button>
            <button type="button" class="admin-btn admin-btn--ghost btnBack"><i class="fa-solid fa-arrow-left"></i></button>
        </form>
    </div></div>
    <script src="admin-api.js?v=14"></script><script src="admin-login.js?v=14"></script>
</body>
</html>
