<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/favicon.js"></script>
    <title>Admin Giriş | Buykon</title>
    <meta name="bizdevar-api" content="https://api.buykon.com/api" />
    <script src="../js/site-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="admin-login.css?v=3" />
</head>
<body class="admin-login-body">
    <div class="admin-login-wrap">
        <div class="admin-login-card">
            <div class="admin-login-brand">
                <div class="admin-login-brand__icon"><i class="fa-solid fa-shield-halved"></i></div>
                <h1>Buykon Admin</h1>
            </div>

            <p class="admin-error" id="adminError" hidden></p>

            <form class="admin-step-panel" id="loginForm">
                <div class="admin-field">
                    <i class="fa-solid fa-envelope admin-field__icon"></i>
                    <input type="email" id="email" autocomplete="email" placeholder="Email" required />
                </div>
                <div class="admin-field">
                    <i class="fa-solid fa-lock admin-field__icon"></i>
                    <input type="password" id="password" autocomplete="current-password" placeholder="Şifrə" required />
                </div>
                <button type="submit" class="admin-btn admin-btn--primary" id="btnLogin">
                    Daxil ol <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="admin-api.js?v=13"></script>
    <script src="admin-login.js?v=13"></script>
</body>
</html>
